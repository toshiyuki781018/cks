apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    env: prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    env: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-client
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-client
  template:
    metadata:
      labels:
        app: prod-client
    spec:
      containers:
      - name: client
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            sleep 3600
          done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-web
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-web
  template:
    metadata:
      labels:
        app: data-web
    spec:
      containers:
      - name: web
        image: nginx:1.27
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: data-web
  namespace: data
spec:
  selector:
    app: data-web
  ports:
  - port: 80
    targetPort: 80
