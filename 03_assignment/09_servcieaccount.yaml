apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stats-monitor-config
  namespace: monitoring
data:
  config.yaml: |
    interval: 30
    logLevel: info
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stats-monitor-sa
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-monitor
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-monitor
  template:
    metadata:
      labels:
        app: stats-monitor
    spec:
      serviceAccountName: stats-monitor-sa

      containers:
      - name: stats-monitor
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            sleep 3600
          done

        volumeMounts:
        - name: config
          mountPath: /etc/stats-monitor
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: stats-monitor-config
